<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080914">
<meta name="description" content="A little world I put together because you deserve a little surprise today. ❤️">
<meta property="og:title" content="Hey you… 👀">
<meta property="og:description" content="I made a little something for you. Open your surprise 💗">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hey you… 👀">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

</head>
<body>
<div id="loader"><div class="loader-gift">🎁</div><b>Preparing your surprise…</b><span>just a second, birthday girl 💗</span></div>
<div id="soundGate" class="sound-gate" aria-modal="true" role="dialog">
  <div class="sound-card">
    <span class="sound-icon">🎧</span>
    <span class="kicker">ONE LITTLE REQUEST…</span>
    <h2>Turn your sound on? ❤️</h2>
    <p>There’s a tiny soundtrack waiting for you.</p>
    <button class="primary" id="soundStart">Yes, let’s start</button>
  </div>
</div>
<div id="decor" aria-hidden="true"></div>
<div id="story" aria-live="polite"></div>
<div class="sound"><button id="musicBtn" aria-label="Music">♫</button><audio id="music" loop preload="auto"></audio></div>
<script src="content.js"></script>
<script src="script.js"></script>
