<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page 4 — A Little Secret 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070d;color:#fff}body{font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}.story-screen{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,#3b2545 0,#151326 42%,#05070d 100%)}.story-screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#f6b7d51a 0,transparent 38%),linear-gradient(180deg,#080a17aa 0,#12112644 48%,#05070e 100%);pointer-events:none}.story-screen:after{content:"";position:absolute;right:18%;top:7%;width:110px;height:110px;border-radius:50%;background:#fff2d92b;box-shadow:0 0 65px #fff1cf22,0 0 110px #a9a0ff1c;filter:blur(.3px);pointer-events:none}.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 14% 18%,rgba(255,255,255,.75) 0 1px,transparent 1.6px),radial-gradient(circle at 78% 24%,rgba(255,255,255,.55) 0 1px,transparent 1.6px),radial-gradient(circle at 35% 68%,rgba(255,255,255,.45) 0 1px,transparent 1.6px),radial-gradient(circle at 88% 72%,rgba(255,255,255,.5) 0 1px,transparent 1.6px),radial-gradient(circle at 55% 12%,rgba(255,255,255,.4) 0 1px,transparent 1.6px);opacity:.55}.content{width:min(680px,92vw);position:relative;z-index:2;text-align:center;padding:34px 10px}.kicker{font-size:.78rem;letter-spacing:.22em;color:#ffbfd7;font-weight:700;text-shadow:0 0 16px #ff6fa844}.content h2{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(2.8rem,11vw,5.6rem);font-weight:400;line-height:.95;margin:12px 0 12px;color:#fff8fc;text-shadow:0 0 28px #ff8fba55}.subtitle{font-size:1.05rem;color:#d7c3d4;margin:0 auto;max-width:420px}.heart-field{position:relative;width:min(560px,100%);height:390px;margin:14px auto 0}.heart-bubble{position:absolute;width:88px;height:88px;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none;color:#fff;font-size:2.25rem;cursor:pointer;transition:transform .55s ease,opacity .45s ease,filter .45s ease,text-shadow .45s ease;animation:drift 4.8s ease-in-out infinite;touch-action:manipulation;z-index:1;display:grid;place-items:center;outline:none}.heart-bubble:focus-visible{outline:1px solid rgba(255,191,215,.6);outline-offset:5px;border-radius:50%}.heart-bubble:hover{filter:brightness(1.2);text-shadow:0 0 18px rgba(255,175,226,.8),0 0 34px rgba(255,140,205,.45)}.heart-bubble.found{opacity:.62;filter:saturate(.72);text-shadow:0 0 10px rgba(255,175,226,.28)}.heart-bubble.active{transform:scale(1.42)!important;opacity:1;filter:brightness(1.35);text-shadow:0 0 22px rgba(255,190,235,.95),0 0 48px rgba(255,145,215,.62)}
/* Each feeling floats freely instead of sitting inside a visible button. */
.personality-1{animation:drift 4.8s ease-in-out infinite,smilePulse 2.8s ease-in-out infinite}.personality-2::after{content:"";position:absolute;inset:2px;border:1px solid rgba(190,220,255,.32);border-radius:50%;animation:soundRipple 1.9s ease-out infinite;pointer-events:none}.personality-2::before{content:"";position:absolute;inset:-5px;border:1px solid rgba(190,220,255,.12);border-radius:50%;animation:soundRipple 1.9s ease-out .65s infinite;pointer-events:none}.personality-3::before,.personality-3::after{content:"";position:absolute;width:24px;height:38px;bottom:21px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,185,232,.28),transparent 68%);filter:blur(2px);pointer-events:none}.personality-3::before{left:14px;transform:rotate(25deg)}.personality-3::after{right:14px;transform:rotate(-25deg)}.personality-4{animation:drift 4.8s ease-in-out infinite}.personality-4::after{content:"";position:absolute;inset:8px;border-radius:50%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.34) 45%,transparent 62%);transform:translateX(-120%);animation:shimmer 3.6s ease-in-out infinite;pointer-events:none}.personality-5::after{content:"";position:absolute;inset:3px;border:1px solid rgba(170,205,255,.22);border-left-color:rgba(255,190,235,.42);border-radius:50%;animation:worldOrbit 5.5s linear infinite;box-shadow:0 0 18px rgba(156,184,255,.18);pointer-events:none}
.heart-bubble.found.personality-2::after,.heart-bubble.found.personality-2::before{animation-play-state:paused}.heart-bubble.found.personality-4::after{animation-play-state:paused}.heart-bubble.found.personality-5::after{animation-play-state:paused}
.love-message{min-height:68px;max-width:520px;margin:0 auto;padding:0 14px;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.25rem,4.5vw,1.75rem);font-style:italic;color:#f8eafa;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}.love-message.show{opacity:1;transform:none}.hint{margin-top:8px;color:#b9a9c7;font-size:.82rem;opacity:.8}.complete{opacity:0;transform:translateY(8px);transition:.5s ease;margin-top:10px;color:#f4d9f1;font-family:'DM Serif Display',Georgia,serif;font-size:1.35rem}.complete.show{opacity:1;transform:none}@keyframes drift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-13px) rotate(2deg)}}@keyframes smilePulse{0%,100%{text-shadow:0 0 12px rgba(255,194,112,.35),0 0 24px rgba(255,151,205,.15)}50%{text-shadow:0 0 25px rgba(255,194,112,.75),0 0 48px rgba(255,151,205,.35)}}@keyframes soundRipple{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.45);opacity:0}100%{transform:scale(1.45);opacity:0}}@keyframes shimmer{0%,30%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}@keyframes worldOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@media(max-width:500px){.heart-field{height:340px}.heart-bubble{width:76px;height:76px;font-size:2rem}.heart-bubble:nth-child(1){left:3%}.heart-bubble:nth-child(2){left:26%}.heart-bubble:nth-child(3){right:24%}.heart-bubble:nth-child(4){right:1%}.heart-bubble:nth-child(5){right:5%;bottom:0}.content{padding-top:24px}.subtitle{font-size:.98rem}}
</style></head>
<body><main class="story-screen love-screen"><div class="stars"></div><div class="content"><span class="kicker">A LITTLE SECRET 💌</span><h2>Tap a heart.</h2><p class="subtitle">There are five little things I don't always say out loud.</p><div class="heart-field"><button class="heart-bubble personality-1" data-i="0" aria-label="Smile">😊</button><button class="heart-bubble personality-2" data-i="1" aria-label="Voice">🎧</button><button class="heart-bubble personality-3" data-i="2" aria-label="Little things">♥️</button><button class="heart-bubble personality-4" data-i="3" aria-label="Missing you">🥹</button><button class="heart-bubble personality-5" data-i="4" aria-label="Us">🌍</button></div><div id="loveMessage" class="love-message"></div><div class="hint" id="hint">Find all five ✨</div><div class="complete" id="complete">Okay… now you know. ❤️</div></div></main>
<script>const love=[['😊','Your smile can fix my whole mood.'],['🎧','Your voice makes the distance feel smaller.'],['♥️','I notice all those tiny things you think nobody notices.'],['🥹','I miss you more than I usually know how to say.'],['🌍',"Distance changes, love doesn't"]];const message=document.getElementById('loveMessage'),hint=document.getElementById('hint'),complete=document.getElementById('complete');const found=new Set();document.querySelectorAll('.heart-bubble').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.i);found.add(i);document.querySelectorAll('.heart-bubble').forEach(x=>x.classList.remove('active'));b.classList.add('active','found');message.textContent=love[i][1];message.classList.remove('show');requestAnimationFrame(()=>message.classList.add('show'));hint.textContent=found.size<5?`${found.size} of 5 discovered ✨`:'';if(found.size===5){setTimeout(()=>complete.classList.add('show'),500);setTimeout(()=>{hint.textContent='But there’s one thing distance keeps reminding me…';},1100)}}));</script></body></html>
