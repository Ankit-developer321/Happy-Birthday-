<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070d;color:#fff}body{font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}.story-screen{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,#3b2545 0,#151326 42%,#05070d 100%)}.story-screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#f6b7d51a 0,transparent 38%),linear-gradient(180deg,#080a17aa 0,#12112644 48%,#05070e 100%);pointer-events:none}.story-screen:after{content:"";position:absolute;right:18%;top:7%;width:110px;height:110px;border-radius:50%;background:#fff2d92b;box-shadow:0 0 65px #fff1cf22,0 0 110px #a9a0ff1c;filter:blur(.3px);pointer-events:none}.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 14% 18%,rgba(255,255,255,.75) 0 1px,transparent 1.6px),radial-gradient(circle at 78% 24%,rgba(255,255,255,.55) 0 1px,transparent 1.6px),radial-gradient(circle at 35% 68%,rgba(255,255,255,.45) 0 1px,transparent 1.6px),radial-gradient(circle at 88% 72%,rgba(255,255,255,.5) 0 1px,transparent 1.6px),radial-gradient(circle at 55% 12%,rgba(255,255,255,.4) 0 1px,transparent 1.6px);opacity:.55}.content{width:min(680px,92vw);position:relative;z-index:2;text-align:center;padding:34px 10px}.kicker{font-size:.78rem;letter-spacing:.22em;color:#ffbfd7;font-weight:700;text-shadow:0 0 16px #ff6fa844}.content h2{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(2.8rem,11vw,5.6rem);font-weight:400;line-height:.95;margin:12px 0 12px;color:#fff8fc;text-shadow:0 0 28px #ff8fba55}.subtitle{font-size:1.05rem;color:#d7c3d4;margin:0 auto;max-width:420px}.heart-field{position:relative;width:min(560px,100%);height:410px;margin:8px auto 0}.heart-bubble{position:absolute;width:76px;height:76px;border:0;border-radius:50%;background:radial-gradient(circle,rgba(255,180,230,.13),transparent 68%);box-shadow:0 0 24px rgba(239,142,224,.22);font-size:2.25rem;cursor:pointer;transition:transform .6s ease,opacity .45s ease,filter .45s ease,box-shadow .45s ease;touch-action:manipulation;z-index:1;display:grid;place-items:center}.heart-bubble:nth-child(1){left:7%;top:28px;animation:floatOne 5.2s ease-in-out infinite}.heart-bubble:nth-child(2){left:30%;top:128px;animation:floatTwo 6.1s ease-in-out infinite}.heart-bubble:nth-child(3){right:30%;top:34px;animation:floatThree 5.7s ease-in-out infinite}.heart-bubble:nth-child(4){right:7%;top:154px;animation:floatFour 6.4s ease-in-out infinite}.heart-bubble:nth-child(5){left:42%;top:265px;animation:floatFive 7s ease-in-out infinite}.heart-bubble:hover{filter:brightness(1.2);box-shadow:0 0 36px rgba(255,157,231,.55)}.heart-bubble.found{opacity:.55;filter:saturate(.7)}.heart-bubble.locked{opacity:.2;filter:grayscale(.65) saturate(.4);cursor:default;box-shadow:none}.heart-bubble.next{opacity:1;box-shadow:0 0 30px rgba(255,157,231,.38),0 0 58px rgba(255,157,231,.12)}.heart-bubble.active{transform:scale(1.35)!important;opacity:1;filter:brightness(1.4);box-shadow:0 0 52px rgba(255,161,232,.8)}.personality-1{animation:floatOne 5.2s ease-in-out infinite,smileGlow 2.8s ease-in-out infinite}.personality-2::after{content:"";position:absolute;inset:-7px;border:1px solid rgba(190,220,255,.36);border-radius:50%;animation:soundRipple 1.9s ease-out infinite;pointer-events:none}.personality-2::before{content:"";position:absolute;inset:-16px;border:1px solid rgba(190,220,255,.14);border-radius:50%;animation:soundRipple 1.9s ease-out .65s infinite;pointer-events:none}.personality-3::before,.personality-3::after{content:"";position:absolute;width:27px;height:42px;bottom:4px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,185,232,.3),transparent 68%);filter:blur(2px);pointer-events:none}.personality-3::before{left:5px;transform:rotate(25deg)}.personality-3::after{right:5px;transform:rotate(-25deg)}.personality-4::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.4) 45%,transparent 62%);transform:translateX(-120%);animation:shimmer 3.6s ease-in-out infinite;pointer-events:none}.personality-5::after{content:"";position:absolute;inset:-9px;border:1px solid rgba(170,205,255,.24);border-left-color:rgba(255,190,235,.48);border-radius:50%;animation:worldOrbit 5.5s linear infinite;box-shadow:0 0 22px rgba(156,184,255,.2);pointer-events:none}.love-message{min-height:68px;max-width:520px;margin:0 auto;padding:0 14px;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.25rem,4.5vw,1.75rem);font-style:italic;color:#f8eafa;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}.love-message.show{opacity:1;transform:none}.hint{margin-top:8px;color:#b9a9c7;font-size:.82rem;opacity:.8}.complete{opacity:0;transform:translateY(8px);transition:.5s ease;margin-top:10px;color:#f4d9f1;font-family:'DM Serif Display',Georgia,serif;font-size:1.35rem}.complete.show{opacity:1;transform:none}@keyframes floatOne{0%,100%{transform:translate(0,0) rotate(-4deg)}25%{transform:translate(13px,-24px) rotate(3deg)}50%{transform:translate(-4px,-42px) rotate(-2deg)}75%{transform:translate(-16px,-18px) rotate(4deg)}}@keyframes floatTwo{0%,100%{transform:translate(0,0) rotate(3deg)}25%{transform:translate(-16px,-34px) rotate(-3deg)}50%{transform:translate(8px,-62px) rotate(4deg)}75%{transform:translate(20px,-27px) rotate(-2deg)}}@keyframes floatThree{0%,100%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(18px,-30px) rotate(4deg)}50%{transform:translate(2px,-55px) rotate(-4deg)}75%{transform:translate(-20px,-25px) rotate(2deg)}}@keyframes floatFour{0%,100%{transform:translate(0,0) rotate(4deg)}25%{transform:translate(-13px,-38px) rotate(-3deg)}50%{transform:translate(7px,-70px) rotate(3deg)}75%{transform:translate(18px,-32px) rotate(-4deg)}}@keyframes floatFive{0%,100%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(20px,-30px) rotate(4deg)}50%{transform:translate(-8px,-58px) rotate(-3deg)}75%{transform:translate(-21px,-22px) rotate(3deg)}}@keyframes smileGlow{0%,100%{box-shadow:0 0 22px rgba(255,194,112,.28)}50%{box-shadow:0 0 42px rgba(255,194,112,.7),0 0 68px rgba(255,151,205,.22)}}@keyframes soundRipple{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}@keyframes shimmer{0%,30%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}@keyframes worldOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@media(max-width:500px){.heart-field{height:360px;margin-top:4px}.heart-bubble{width:62px;height:62px;font-size:1.8rem}.heart-bubble:nth-child(1){left:2%;top:18px}.heart-bubble:nth-child(2){left:25%;top:100px}.heart-bubble:nth-child(3){right:23%;top:18px}.heart-bubble:nth-child(4){right:1%;top:122px}.heart-bubble:nth-child(5){left:40%;top:225px}.content{padding-top:24px}.subtitle{font-size:.98rem}}
</style></head>
<body><main class="story-screen love-screen"><div class="stars"></div><div class="content"><span class="kicker">A LITTLE SECRET 💌</span><h2>Tap a heart.</h2><p class="subtitle">There are five little things I don't always say out loud.</p><div class="heart-field"><button class="heart-bubble personality-1 next" data-i="0" aria-label="Smile">😊</button><button class="heart-bubble personality-2 locked" data-i="1" aria-label="Voice">🎧</button><button class="heart-bubble personality-3 locked" data-i="2" aria-label="Little things">♥️</button><button class="heart-bubble personality-4 locked" data-i="3" aria-label="Missing you">🥹</button><button class="heart-bubble personality-5 locked" data-i="4" aria-label="Us">🌍</button></div><div id="loveMessage" class="love-message"></div><div class="hint" id="hint">Start with the first little secret ✨</div><div class="complete" id="complete">Okay… now you know. ❤️</div></div></main>
<script>const love=[['😊','Your smile can fix my whole mood.'],['🎧','Your voice makes the distance feel smaller.'],['♥️','I notice all those tiny things you think nobody notices.'],['🥹','I miss you more than I usually know how to say.'],['🌍',"Distance changes, love doesn't"]];const hearts=[...document.querySelectorAll('.heart-bubble')],message=document.getElementById('loveMessage'),hint=document.getElementById('hint'),complete=document.getElementById('complete');let current=0;hearts.forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.i);if(i!==current)return;hearts.forEach(x=>x.classList.remove('active'));b.classList.add('active','found');message.textContent=love[i][1];message.classList.remove('show');requestAnimationFrame(()=>message.classList.add('show'));current++;if(current<5){hearts[current].classList.remove('locked');hearts[current].classList.add('next');hint.textContent=`Now find the next little secret ✨`;setTimeout(()=>{b.classList.remove('active');},650)}else{hint.textContent='';setTimeout(()=>complete.classList.add('show'),500);setTimeout(()=>{hint.textContent='But there’s one thing distance keeps reminding me…';},1100)}}));</script></body></html>
