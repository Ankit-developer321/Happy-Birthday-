<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Page 4 — A Little Secret 💌</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070d;color:#fff}body{font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}.story-screen{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,#3b2545 0,#151326 42%,#05070d 100%)}.story-screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#f6b7d51a 0,transparent 38%),linear-gradient(180deg,#080a17aa 0,#12112644 48%,#05070e 100%);pointer-events:none}.story-screen:after{content:"";position:absolute;right:18%;top:7%;width:110px;height:110px;border-radius:50%;background:#fff2d92b;box-shadow:0 0 65px #fff1cf22,0 0 110px #a9a0ff1c;pointer-events:none}.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 14% 18%,rgba(255,255,255,.75) 0 1px,transparent 1.6px),radial-gradient(circle at 78% 24%,rgba(255,255,255,.55) 0 1px,transparent 1.6px),radial-gradient(circle at 35% 68%,rgba(255,255,255,.45) 0 1px,transparent 1.6px),radial-gradient(circle at 88% 72%,rgba(255,255,255,.5) 0 1px,transparent 1.6px),radial-gradient(circle at 55% 12%,rgba(255,255,255,.4) 0 1px,transparent 1.6px);opacity:.55}.content{width:min(680px,92vw);position:relative;z-index:2;text-align:center;padding:30px 10px}.kicker{font-size:.78rem;letter-spacing:.22em;color:#ffbfd7;font-weight:700;text-shadow:0 0 16px #ff6fa844}.content h2{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(2.7rem,11vw,5.2rem);font-weight:400;line-height:.95;margin:12px 0;color:#fff8fc;text-shadow:0 0 28px #ff8fba55}.subtitle{font-size:1.02rem;color:#d7c3d4;margin:0 auto;max-width:400px}.heart-field{position:relative;width:min(560px,100%);height:405px;margin:7px auto 0}.secret-bubble{position:absolute;width:76px;height:76px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;background:radial-gradient(circle at 38% 32%,rgba(255,232,247,.2),rgba(255,173,222,.07) 43%,rgba(255,173,222,0) 72%);box-shadow:0 0 22px rgba(239,142,224,.2);color:#fbeaf6;font:600 .92rem 'Baloo 2',system-ui,sans-serif;letter-spacing:.08em;transition:transform .55s ease,opacity .45s ease,filter .45s ease,box-shadow .45s ease;z-index:1}.secret-bubble:before{content:"";position:absolute;inset:-5px;border:1px solid rgba(255,203,229,.13);border-radius:50%;box-shadow:0 0 24px rgba(255,157,218,.1);pointer-events:none}.secret-bubble:after{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 67%);pointer-events:none}.secret-bubble:hover{filter:brightness(1.18);box-shadow:0 0 34px rgba(255,157,231,.4)}.secret-bubble:active{transform:scale(1.08)}.secret-bubble.found{opacity:.46;transform:scale(.78);box-shadow:0 0 28px rgba(255,185,226,.35)}.secret-bubble.found:before{border-color:rgba(255,203,229,.35)}.secret-bubble.active{opacity:1;transform:scale(1.18)!important;box-shadow:0 0 48px rgba(255,161,232,.72)}.secret-bubble:nth-child(1){left:7%;top:34px;animation:floatOne 5.2s ease-in-out infinite}.secret-bubble:nth-child(2){left:31%;top:142px;animation:floatTwo 6.1s ease-in-out infinite}.secret-bubble:nth-child(3){right:29%;top:27px;animation:floatThree 5.7s ease-in-out infinite}.secret-bubble:nth-child(4){right:6%;top:164px;animation:floatFour 6.4s ease-in-out infinite}.secret-bubble:nth-child(5){left:43%;top:277px;animation:floatFive 7s ease-in-out infinite}.personality-1{animation:floatOne 5.2s ease-in-out infinite,smileGlow 2.8s ease-in-out infinite}.personality-2:after{inset:-7px;border-color:rgba(190,220,255,.28);animation:soundRipple 1.9s ease-out infinite}.personality-3:before,.personality-3:after{content:"";position:absolute;width:25px;height:40px;bottom:4px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,185,232,.25),transparent 68%);filter:blur(2px)}.personality-3:before{left:5px;transform:rotate(25deg)}.personality-3:after{right:5px;transform:rotate(-25deg)}.personality-4:after{content:"";position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.35) 45%,transparent 62%);transform:translateX(-120%);animation:shimmer 3.6s ease-in-out infinite}.personality-5:after{content:"";position:absolute;inset:-9px;border:1px solid rgba(170,205,255,.22);border-left-color:rgba(255,190,235,.42);border-radius:50%;animation:worldOrbit 5.5s linear infinite;box-shadow:0 0 22px rgba(156,184,255,.18)}.love-message{min-height:68px;max-width:520px;margin:0 auto;padding:0 14px;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.25rem,4.5vw,1.75rem);font-style:italic;color:#f8eafa;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}.love-message.show{opacity:1;transform:none}.hint{margin-top:7px;color:#b9a9c7;font-size:.82rem;opacity:.8}.complete{opacity:0;transform:translateY(8px);transition:.5s ease;margin-top:10px;color:#f4d9f1;font-family:'DM Serif Display',Georgia,serif;font-size:1.3rem}.complete.show{opacity:1;transform:none}@keyframes floatOne{0%,100%{transform:translate(0,0) rotate(-4deg)}25%{transform:translate(13px,-24px) rotate(3deg)}50%{transform:translate(-4px,-42px) rotate(-2deg)}75%{transform:translate(-16px,-18px) rotate(4deg)}}@keyframes floatTwo{0%,100%{transform:translate(0,0) rotate(3deg)}25%{transform:translate(-16px,-34px) rotate(-3deg)}50%{transform:translate(8px,-62px) rotate(4deg)}75%{transform:translate(20px,-27px) rotate(-2deg)}}@keyframes floatThree{0%,100%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(18px,-30px) rotate(4deg)}50%{transform:translate(2px,-55px) rotate(-4deg)}75%{transform:translate(-20px,-25px) rotate(2deg)}}@keyframes floatFour{0%,100%{transform:translate(0,0) rotate(4deg)}25%{transform:translate(-13px,-38px) rotate(-3deg)}50%{transform:translate(7px,-70px) rotate(3deg)}75%{transform:translate(18px,-32px) rotate(-4deg)}}@keyframes floatFive{0%,100%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(20px,-30px) rotate(4deg)}50%{transform:translate(-8px,-58px) rotate(-3deg)}75%{transform:translate(-21px,-22px) rotate(3deg)}}@keyframes smileGlow{0%,100%{box-shadow:0 0 22px rgba(255,194,112,.28)}50%{box-shadow:0 0 42px rgba(255,194,112,.7),0 0 68px rgba(255,151,205,.22)}}@keyframes soundRipple{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}@keyframes shimmer{0%,30%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}@keyframes worldOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@media(max-width:500px){.content{padding-top:22px}.heart-field{height:355px;margin-top:2px}.secret-bubble{width:62px;height:62px;font-size:.78rem}.secret-bubble:nth-child(1){left:2%;top:20px}.secret-bubble:nth-child(2){left:25%;top:104px}.secret-bubble:nth-child(3){right:22%;top:17px}.secret-bubble:nth-child(4){right:1%;top:127px}.secret-bubble:nth-child(5){left:40%;top:230px}.subtitle{font-size:.97rem}}</style></head><body><main class="story-screen love-screen"><div class="stars"></div><div class="content"><span class="kicker">A LITTLE SECRET 💌</span><h2>Five little things.</h2><p class="subtitle">Tap them whenever you find one.</p><div class="heart-field"><button class="secret-bubble personality-1" data-i="0" aria-label="Secret 01">01</button><button class="secret-bubble personality-2" data-i="1" aria-label="Secret 02">02</button><button class="secret-bubble personality-3" data-i="2" aria-label="Secret 03">03</button><button class="secret-bubble personality-4" data-i="3" aria-label="Secret 04">04</button><button class="secret-bubble personality-5" data-i="4" aria-label="Secret 05">05</button></div><div id="loveMessage" class="love-message"></div><div class="hint" id="hint">Find a floating secret ✨</div><div class="complete" id="complete">Okay… now you know. ❤️</div></div></main><script>const secrets=['Your smile can fix my whole mood.','Your voice makes the distance feel smaller.','I notice all those tiny things you think nobody notices.','I miss you more than I usually know how to say.',"Distance changes, love doesn't"];const bubbles=[...document.querySelectorAll('.secret-bubble')],message=document.getElementById('loveMessage'),hint=document.getElementById('hint'),complete=document.getElementById('complete');let found=new Set;function showMessage(text){message.classList.remove('show');requestAnimationFrame(()=>{message.textContent=text;message.classList.add('show')})}bubbles.forEach((bubble)=>bubble.addEventListener('click',()=>{const i=Number(bubble.dataset.i);if(found.has(i))return;found.add(i);bubbles.forEach(b=>b.classList.remove('active'));bubble.classList.add('found','active');showMessage(secrets[i]);const left=5-found.size;hint.textContent=left?`${left} little secret${left===1?'':'s'} left… ✨`:'';if(found.size===5){setTimeout(()=>complete.classList.add('show'),500);setTimeout(()=>{hint.textContent='But there’s one thing distance keeps reminding me…'},1100)}}));</script></body></html>
